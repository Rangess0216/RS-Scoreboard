<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="scoreboard" class="container">
        
        <div class="top-bar">
            <div class="group">
                <div class="item">
                    <div class="icon-box grey-bg"><i class="fa-solid fa-id-card"></i></div>
                    <span class="label">ID:</span> <span id="my-id">0</span>
                </div>
                <div class="item">
                    <div class="icon-box purple-bg"><i class="fa-solid fa-users"></i></div>
                    <span class="label">Gracze:</span> <span id="players">0</span>
                </div>
            </div>

            <div class="separator"></div>

            <div class="group">
                <div class="item">
                    <div class="icon-box blue-bg"><i class="fa-solid fa-user-shield"></i></div>
                    <span class="label">LSPD:</span> <span id="police">0</span>
                </div>
                
                <div class="item">
                    <div class="icon-box red-bg"><i class="fa-solid fa-heart-pulse"></i></div>
                    <span class="label">EMS:</span> <span id="ambulance">0</span>
                </div>
                
                <div class="item">
                    <div class="icon-box yellow-bg"><i class="fa-solid fa-wrench"></i></div>
                    <span class="label">Mech:</span> <span id="mechanic">0</span>
                </div>

                <div class="item">
                    <div class="icon-box orange-bg"><i class="fa-solid fa-scale-balanced"></i></div>
                    <span class="label">DOJ:</span> <span id="doj">0</span>
                </div>
            </div>
        </div>
        </div>
    <script src="script.js"></script>
</body>
</html>
